<app-navbar></app-navbar>


<main class="groups-page">

    <h1>Groups</h1>


    <div class="search">

        <label for="search">
            Search Groups
        </label>

        <input
            id="search"
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Search groups"
        >

    </div>


    <button
        (click)="showGroupRequestForm =
            !showGroupRequestForm"
    >
        Request New Group
    </button>


    <form
        *ngIf="showGroupRequestForm"
        (ngSubmit)="submitGroupRequest()"
        class="group-request-form"
    >

        <h2>Request New Group</h2>


        <label>Title</label>

        <input
            name="requestTitle"
            [(ngModel)]="requestTitle"
            maxlength="30"
            required
        >


        <label>Description</label>

        <textarea
            name="requestDescription"
            [(ngModel)]="requestDescription"
            maxlength="250"
            required
        ></textarea>


        <label>Minimum Age</label>

        <input
            name="requestMinimumAge"
            type="number"
            [(ngModel)]="requestMinimumAge"
            required
        >


        <label>Theme</label>

        <select
            name="requestTheme"
            [(ngModel)]="requestTheme"
        >

            <option value="default">
                Default
            </option>

            <option value="dark">
                Dark
            </option>

            <option value="blue">
                Blue
            </option>

        </select>


        <button type="submit">
            Submit Request
        </button>

    </form>


    <p
        class="success"
        *ngIf="successMessage"
    >
        {{ successMessage }}
    </p>


    <p
        class="error"
        *ngIf="errorMessage"
    >
        {{ errorMessage }}
    </p>


    <h2>Your Groups</h2>


    <div
        class="group-card"
        *ngFor="let group of filteredGroups"
    >

        <ng-container
            *ngIf="isMember(group)"
        >

            <h3>
                {{ group.title }}
            </h3>

            <p>
                {{ group.description }}
            </p>

            <p>
                Minimum Age:
                {{ group.minimumAge }}+
            </p>


            <strong
                *ngIf="isAdmin(group)"
            >
                Group Administrator
            </strong>


            <a
                *ngIf="isAdmin(group)"
                [routerLink]="[
                    '/groups',
                    group.id,
                    'admin'
                ]"
            >
                Manage Group
            </a>

        </ng-container>

    </div>


    <h2>All Groups</h2>


    <div
        class="group-card"
        *ngFor="let group of filteredGroups"
    >

        <ng-container
            *ngIf="!isMember(group)"
        >

            <h3>
                {{ group.title }}
            </h3>

            <p>
                {{ group.description }}
            </p>

            <p>
                Minimum Age:
                {{ group.minimumAge }}+
            </p>


            <button
                (click)="requestJoin(group)"
            >
                Request to Join
            </button>

        </ng-container>

    </div>

</main>
