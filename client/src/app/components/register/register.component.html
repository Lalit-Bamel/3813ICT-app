<div class="auth-page">

<div class="brand-header">

    <img
        src="/fabulari-logo.png"
        alt="Fabulari - where communities meet"
        class="fabulari-logo"
    >

</div>

    <div class="auth-card">

        <h2>Create Account</h2>

        <form (ngSubmit)="onSubmit()">

            <label for="firstName">
                First Name
            </label>

            <input
                id="firstName"
                name="firstName"
                [(ngModel)]="firstName"
                required
            >

            <label for="lastName">
                Last Name
            </label>

            <input
                id="lastName"
                name="lastName"
                [(ngModel)]="lastName"
                required
            >

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                [(ngModel)]="username"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="email"
                required
            >

<label for="dateOfBirth">
    Date of Birth
</label>

<input
    id="dateOfBirth"
    name="dateOfBirth"
    type="date"
    [(ngModel)]="dateOfBirth"
    [max]="latestDateOfBirth"
    (ngModelChange)="onDateOfBirthChange()"
    required
>

<small>
    Select your date of birth using the calendar.
</small>

<p
    *ngIf="calculatedAge !== null"
>
    Age:
    <strong>
        {{ calculatedAge }}
    </strong>
</p>

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                [(ngModel)]="password"
                required
            >

            <small>
                Minimum 8 characters and at least
                one uppercase letter.
            </small>

            <p
                class="error"
                *ngIf="errorMessage"
            >
                {{ errorMessage }}
            </p>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a routerLink="/login">
                Login
            </a>
        </p>

    </div>

</div>
