<app-navbar></app-navbar>


<main class="admin-page">

    <a routerLink="/groups">
        ← Back to Groups
    </a>


    <h1 *ngIf="group">
        {{ group.title }} — Admin
    </h1>


    <h2>Pending Requests</h2>


    <p *ngIf="joinRequests.length === 0">
        No pending requests.
    </p>


    <div
        class="request-card"
        *ngFor="let request of joinRequests"
    >


        <!-- JOIN REQUEST -->
        <ng-container
            *ngIf="request.type === 'joinGroup'"
        >

            <h3>
                Join Request
            </h3>

            <p>
                User:
                {{ request.requesterUsername }}
            </p>

        </ng-container>



        <!-- ROOM PROPOSAL -->
        <ng-container
            *ngIf="request.type === 'roomCreation'"
        >

            <h3>
                Room Proposal
            </h3>

            <p>
                Requested by:
                {{ request.requesterUsername }}
            </p>

            <p>
                Proposed room:
                {{ request.details.roomName }}
            </p>

        </ng-container>



        <!-- NORMAL ACTION BUTTONS -->
        <div
            *ngIf="
                rejectingRequestId !== request.id
            "
        >

            <button
                type="button"
                (click)="approve(request)"
            >
                Approve
            </button>


            <button
                type="button"
                (click)="startReject(request)"
            >
                Reject
            </button>

        </div>



        <!-- REJECTION MODE -->
        <div
            *ngIf="
                rejectingRequestId === request.id
            "
        >

            <label>
                Rejection Reason
            </label>


            <input
                type="text"
                [(ngModel)]="rejectionReason"
                placeholder="Enter rejection reason"
            >


            <button
                type="button"
                (click)="confirmReject(request)"
            >
                Confirm Reject
            </button>


            <button
                type="button"
                (click)="cancelReject()"
            >
                Cancel
            </button>

        </div>

    </div>


    <p
        *ngIf="successMessage"
        class="success"
    >
        {{ successMessage }}
    </p>


    <p
        *ngIf="errorMessage"
        class="error"
    >
        {{ errorMessage }}
    </p>

</main>
